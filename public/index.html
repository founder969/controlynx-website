<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controlynx — Daily Progress Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ─── DESIGN TOKENS (extracted from controlynx.ai) ─────────────────────── */
:root {
  --bg:          #080D14;
  --bg-2:        #0C1220;
  --bg-3:        #101828;
  --bg-card:     #0F1A27;
  --bg-card-2:   #111F30;
  --border:      #1A2D40;
  --border-2:    #1F3347;
  --cyan:        #00D4FF;
  --cyan-dim:    rgba(0,212,255,0.12);
  --cyan-border: rgba(0,212,255,0.20);
  --cyan-glow:   rgba(0,212,255,0.07);
  --green:       #00C48C;
  --green-dim:   rgba(0,196,140,0.12);
  --amber:       #F4A030;
  --amber-dim:   rgba(244,160,48,0.12);
  --red:         #FF4D4D;
  --red-dim:     rgba(255,77,77,0.10);
  --purple:      #8B5CF6;
  --purple-dim:  rgba(139,92,246,0.12);
  --white:       #F0F4F8;
  --white-2:     #B8C5D0;
  --white-3:     #6B7F8E;
  --white-4:     #3A4F60;
  --sans:        'Figtree', sans-serif;
  --display:     'Syne', sans-serif;
  --mono:        'JetBrains Mono', monospace;
  --r-sm:  6px;
  --r-md:  10px;
  --r-lg:  16px;
  --r-xl:  20px;
  --shadow-card: 0 1px 0 rgba(255,255,255,0.04) inset, 0 0 0 0.5px var(--border);
}

/* ─── RESET ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
input, select, textarea, button { font-family: var(--sans); }
button { cursor: pointer; border: none; outline: none; }
input, select, textarea { outline: none; }

/* ─── SCROLLBAR ──────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg-2); }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

/* ─── HEADER ─────────────────────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 56px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  flex-shrink: 0;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.logo-icon {
  width: 30px; height: 30px;
  background: var(--cyan-dim);
  border: 1px solid var(--cyan-border);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.logo-icon svg { width: 16px; height: 16px; }
.logo-name { font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--white); }
.logo-name span { color: var(--cyan); }
.header-center {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.header-title { font-size: 13px; font-weight: 600; color: var(--white); }
.header-sub { font-size: 11px; color: var(--white-3); font-family: var(--mono); }
.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.save-indicator {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--green);
  font-family: var(--mono);
}
.save-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
.role-badge {
  padding: 4px 10px;
  background: var(--cyan-dim);
  border: 1px solid var(--cyan-border);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  color: var(--cyan);
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.step-counter {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--white-3);
}
.step-counter span { color: var(--cyan); }

/* ─── PROGRESS BAR ───────────────────────────────────────────────────────── */
.progress-bar-track {
  height: 2px;
  background: var(--border);
  flex-shrink: 0;
}
.progress-bar-fill {
  height: 2px;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  transition: width 0.4s ease;
}

/* ─── TAB NAV ────────────────────────────────────────────────────────────── */
.tab-nav {
  display: flex;
  align-items: stretch;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  flex-shrink: 0;
  scrollbar-width: none;
}
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 16px;
  height: 44px;
  font-size: 12px;
  font-weight: 500;
  color: var(--white-3);
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: all 0.2s;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
}
.tab-btn:hover { color: var(--white-2); background: rgba(255,255,255,0.02); }
.tab-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }
.tab-btn.complete .tab-icon { color: var(--green); }
.tab-btn.complete::after {
  content: '';
  position: absolute;
  top: 8px; right: 8px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--green);
}
.tab-btn.ntr-confirmed::after { background: var(--white-3); }
.tab-icon { font-size: 13px; }
.tab-num {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--white-4);
  margin-right: 2px;
}

/* ─── MAIN CONTENT ───────────────────────────────────────────────────────── */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
}

/* ─── SECTION HEADER ─────────────────────────────────────────────────────── */
.section-header {
  margin-bottom: 20px;
}
.section-title {
  font-family: var(--display);
  font-size: 20px;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 4px;
}
.section-desc {
  font-size: 12px;
  color: var(--white-3);
  line-height: 1.5;
}

/* ─── CARD ───────────────────────────────────────────────────────────────── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 20px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-card);
}
.card-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--white-3);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title::before {
  content: '';
  display: inline-block;
  width: 3px; height: 12px;
  background: var(--cyan);
  border-radius: 2px;
}

/* ─── FORM GRID ──────────────────────────────────────────────────────────── */
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.form-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.form-grid.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.form-grid.full { grid-template-columns: 1fr; }
.span-2 { grid-column: span 2; }
.span-3 { grid-column: span 3; }

/* ─── FIELD ──────────────────────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--white-3);
  display: flex;
  align-items: center;
  gap: 6px;
}
.field label .req { color: var(--cyan); font-size: 10px; }
.field label .auto-badge {
  padding: 1px 6px;
  background: var(--cyan-dim);
  border: 1px solid var(--cyan-border);
  border-radius: 4px;
  font-size: 9px;
  color: var(--cyan);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.field label .ai-badge {
  padding: 1px 6px;
  background: var(--purple-dim);
  border: 1px solid rgba(139,92,246,0.25);
  border-radius: 4px;
  font-size: 9px;
  color: var(--purple);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.field input,
.field select,
.field textarea {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: var(--r-md);
  padding: 10px 12px;
  font-size: 13px;
  color: var(--white);
  transition: border-color 0.2s, box-shadow 0.2s;
  width: 100%;
}
.field input::placeholder,
.field textarea::placeholder { color: var(--white-4); }
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--cyan-border);
  box-shadow: 0 0 0 3px var(--cyan-glow);
}
.field input[readonly],
.field input.auto {
  color: var(--cyan);
  font-family: var(--mono);
  font-size: 12px;
  background: rgba(0,212,255,0.04);
  border-color: var(--border);
  cursor: default;
}
.field textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.field select option { background: var(--bg-3); color: var(--white); }

/* ─── AUTO VALUE DISPLAY ─────────────────────────────────────────────────── */
.auto-value {
  background: rgba(0,212,255,0.04);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 10px 12px;
  font-size: 13px;
  color: var(--cyan);
  font-family: var(--mono);
}

/* ─── WEATHER TILES ──────────────────────────────────────────────────────── */
.weather-tiles {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.weather-tile {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: var(--r-md);
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.weather-tile:hover { border-color: var(--cyan-border); }
.weather-tile.selected {
  background: var(--cyan-dim);
  border-color: var(--cyan-border);
}
.weather-tile .wt-icon { font-size: 22px; margin-bottom: 4px; }
.weather-tile .wt-label { font-size: 11px; color: var(--white-2); font-weight: 500; }

/* ─── WEATHER STAT CARDS ─────────────────────────────────────────────────── */
.weather-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.weather-stat {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px;
}
.weather-stat-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--white-3);
  margin-bottom: 4px;
  font-weight: 600;
}
.weather-stat-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--cyan);
  font-family: var(--mono);
}
.weather-stat-unit { font-size: 11px; color: var(--white-3); margin-left: 2px; }
.weather-loading {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--white-3);
  padding: 8px 0;
}
.spin {
  width: 14px; height: 14px;
  border: 2px solid var(--border-2);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── STEPPER ────────────────────────────────────────────────────────────── */
.stepper-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: 6px;
  transition: border-color 0.2s;
}
.stepper-row:hover { border-color: var(--border-2); }
.stepper-label { font-size: 13px; color: var(--white-2); flex: 1; }
.stepper-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}
.stepper-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  color: var(--white-2);
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  line-height: 1;
}
.stepper-btn:hover { background: var(--cyan-dim); border-color: var(--cyan-border); color: var(--cyan); }
.stepper-value {
  width: 48px;
  text-align: center;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--white);
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  border-radius: var(--r-sm);
  padding: 4px;
}
.stepper-value:focus { border-color: var(--cyan-border); }
.stepper-remove {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--white-4);
  font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.stepper-remove:hover { background: var(--red-dim); border-color: var(--red); color: var(--red); }

/* ─── SECTION GROUP ──────────────────────────────────────────────────────── */
.group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color 0.2s;
}
.group-header:hover { border-color: var(--border-2); }
.group-header-left { display: flex; align-items: center; gap: 10px; }
.group-chevron { color: var(--white-3); font-size: 12px; transition: transform 0.2s; }
.group-chevron.open { transform: rotate(180deg); }
.group-name { font-size: 13px; font-weight: 600; color: var(--white); }
.group-total {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--cyan);
  background: var(--cyan-dim);
  padding: 3px 10px;
  border-radius: 20px;
}
.group-body { padding-left: 8px; margin-bottom: 8px; }

/* ─── ADD BUTTON ─────────────────────────────────────────────────────────── */
.add-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: transparent;
  border: 1px dashed var(--border-2);
  border-radius: var(--r-md);
  color: var(--white-3);
  font-size: 12px;
  font-family: var(--sans);
  font-weight: 500;
  transition: all 0.2s;
  width: 100%;
  justify-content: center;
  margin-top: 4px;
}
.add-btn:hover { border-color: var(--cyan-border); color: var(--cyan); background: var(--cyan-dim); }
.add-btn .plus { font-size: 16px; }

/* ─── ACTIVITY CARD ──────────────────────────────────────────────────────── */
.activity-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px;
  margin-bottom: 8px;
  transition: border-color 0.2s;
}
.activity-card:hover { border-color: var(--border-2); }
.activity-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 12px;
}
.activity-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.activity-tag {
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.tag-civil { background: var(--cyan-dim); color: var(--cyan); }
.tag-mep { background: var(--purple-dim); color: var(--purple); }
.tag-structural { background: var(--amber-dim); color: var(--amber); }
.tag-finishes { background: var(--green-dim); color: var(--green); }

/* ─── STATUS TAGS ────────────────────────────────────────────────────────── */
.status-group { display: flex; gap: 6px; flex-wrap: wrap; }
.status-tag {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  background: var(--bg-3);
  color: var(--white-3);
}
.status-tag:hover { border-color: var(--border-2); }
.status-tag.active-ontrack { background: var(--green-dim); color: var(--green); border-color: rgba(0,196,140,0.3); }
.status-tag.active-delayed { background: var(--amber-dim); color: var(--amber); border-color: rgba(244,160,48,0.3); }
.status-tag.active-blocked { background: var(--red-dim); color: var(--red); border-color: rgba(255,77,77,0.3); }
.status-tag.active-complete { background: var(--cyan-dim); color: var(--cyan); border-color: var(--cyan-border); }

/* ─── PROGRESS SLIDER ────────────────────────────────────────────────────── */
.progress-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
}
.progress-label { font-size: 11px; color: var(--white-3); white-space: nowrap; }
.progress-slider {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  background: var(--border-2);
  border-radius: 2px;
  cursor: pointer;
}
.progress-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--cyan);
  cursor: pointer;
  transition: transform 0.15s;
  box-shadow: 0 0 8px rgba(0,212,255,0.4);
}
.progress-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
.progress-slider { background: linear-gradient(to right, var(--cyan) 0%, var(--cyan) var(--val, 0%), var(--border-2) var(--val, 0%), var(--border-2) 100%); }
.progress-value {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--cyan);
  min-width: 36px;
  text-align: right;
}

/* ─── AI MAP INDICATOR ───────────────────────────────────────────────────── */
.ai-map-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  padding: 7px 10px;
  background: var(--purple-dim);
  border: 1px solid rgba(139,92,246,0.2);
  border-radius: var(--r-sm);
  font-size: 11px;
}
.ai-map-icon { color: var(--purple); }
.ai-map-text { color: var(--white-3); flex: 1; }
.ai-map-id { font-family: var(--mono); color: var(--purple); font-weight: 600; }
.ai-confidence {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 600;
}
.conf-high { background: var(--green-dim); color: var(--green); }
.conf-med { background: var(--amber-dim); color: var(--amber); }
.conf-low { background: var(--red-dim); color: var(--red); }

/* ─── EQUIPMENT CARD ─────────────────────────────────────────────────────── */
.equipment-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  margin-bottom: 8px;
}
.equipment-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.equipment-name { font-size: 13px; font-weight: 600; color: var(--white); }
.eq-status-group { display: flex; gap: 5px; }
.eq-status {
  padding: 3px 9px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  background: var(--bg-3);
  color: var(--white-3);
  transition: all 0.15s;
}
.eq-working.active { background: var(--green-dim); color: var(--green); border-color: rgba(0,196,140,0.3); }
.eq-breakdown.active { background: var(--red-dim); color: var(--red); border-color: rgba(255,77,77,0.3); }
.eq-repair.active { background: var(--amber-dim); color: var(--amber); border-color: rgba(244,160,48,0.3); }
.eq-demob.active { background: var(--white-4); color: var(--white-2); border-color: var(--border-2); }

/* ─── ISSUE CARD ─────────────────────────────────────────────────────────── */
.issue-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px;
  margin-bottom: 8px;
  border-left: 3px solid transparent;
}
.issue-card.sev-high { border-left-color: var(--red); }
.issue-card.sev-medium { border-left-color: var(--amber); }
.issue-card.sev-low { border-left-color: var(--white-3); }
.sev-group { display: flex; gap: 5px; }
.sev-tag {
  padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent;
  background: var(--bg-3); color: var(--white-3); transition: all 0.15s;
}
.sev-high.active { background: var(--red-dim); color: var(--red); border-color: rgba(255,77,77,0.3); }
.sev-medium.active { background: var(--amber-dim); color: var(--amber); border-color: rgba(244,160,48,0.3); }
.sev-low.active { background: var(--green-dim); color: var(--green); border-color: rgba(0,196,140,0.3); }

/* ─── MATERIAL ROW ───────────────────────────────────────────────────────── */
.material-row {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  margin-bottom: 8px;
}
.mat-status-group { display: flex; gap: 5px; }
.mat-status {
  padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent;
  background: var(--bg-3); color: var(--white-3); transition: all 0.15s;
}
.mat-accepted.active { background: var(--green-dim); color: var(--green); border-color: rgba(0,196,140,0.3); }
.mat-rejected.active { background: var(--red-dim); color: var(--red); border-color: rgba(255,77,77,0.3); }
.mat-hold.active { background: var(--amber-dim); color: var(--amber); border-color: rgba(244,160,48,0.3); }

/* ─── NOTHING TO REPORT ──────────────────────────────────────────────────── */
.ntr-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-2);
  border: 1px dashed var(--border-2);
  border-radius: var(--r-md);
  margin-bottom: 12px;
}
.ntr-toggle {
  position: relative;
  width: 36px; height: 20px;
  flex-shrink: 0;
}
.ntr-toggle input {
  opacity: 0; width: 0; height: 0; position: absolute;
}
.ntr-slider {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--border-2);
  border-radius: 20px;
  transition: background 0.2s;
  cursor: pointer;
}
.ntr-slider::before {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  left: 3px; bottom: 3px;
  background: var(--white);
  border-radius: 50%;
  transition: transform 0.2s;
}
.ntr-toggle input:checked + .ntr-slider { background: var(--green); }
.ntr-toggle input:checked + .ntr-slider::before { transform: translateX(16px); }
.ntr-label {
  font-size: 12px;
  color: var(--white-3);
}
.ntr-label strong { color: var(--white-2); }

/* ─── PHOTO UPLOAD ───────────────────────────────────────────────────────── */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.photo-thumb {
  aspect-ratio: 1;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  overflow: hidden;
  position: relative;
}
.photo-thumb:hover { border-color: var(--cyan-border); }
.photo-thumb.has-photo { border-color: var(--border-2); }
.photo-thumb.has-photo img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.photo-thumb .photo-add-icon { font-size: 20px; color: var(--white-4); }
.photo-thumb .photo-add-label { font-size: 10px; color: var(--white-4); margin-top: 4px; }
.photo-remove {
  position: absolute;
  top: 4px; right: 4px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  color: var(--white);
  font-size: 12px;
  display: none;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
}
.photo-thumb.has-photo:hover .photo-remove { display: flex; }

/* ─── SIGNOFF / REVIEW ───────────────────────────────────────────────────── */
.review-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.review-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
}
.review-icon { font-size: 16px; }
.review-tab-name { font-size: 12px; font-weight: 500; color: var(--white-2); flex: 1; }
.review-status { font-size: 11px; font-weight: 600; }
.rs-complete { color: var(--green); }
.rs-ntr { color: var(--white-3); }
.rs-pending { color: var(--amber); }
.rs-empty { color: var(--red); }

/* ─── SUBMIT BUTTON ──────────────────────────────────────────────────────── */
.submit-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--cyan) 0%, #0099bb 100%);
  color: var(--bg);
  font-size: 14px;
  font-weight: 700;
  font-family: var(--display);
  border-radius: var(--r-lg);
  letter-spacing: 0.03em;
  transition: all 0.2s;
  box-shadow: 0 0 30px rgba(0,212,255,0.2);
}
.submit-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 40px rgba(0,212,255,0.35);
}
.submit-btn:disabled {
  background: var(--border-2);
  color: var(--white-4);
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* ─── NAVIGATION BUTTONS ─────────────────────────────────────────────────── */
.nav-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  background: var(--bg-2);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.nav-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--r-md);
  font-size: 13px;
  font-weight: 600;
  font-family: var(--sans);
  transition: all 0.2s;
}
.nav-btn.back {
  background: transparent;
  border: 1px solid var(--border-2);
  color: var(--white-2);
}
.nav-btn.back:hover { border-color: var(--white-3); color: var(--white); }
.nav-btn.next {
  background: var(--cyan);
  border: none;
  color: var(--bg);
}
.nav-btn.next:hover { background: #00b8e0; box-shadow: 0 0 20px rgba(0,212,255,0.3); }
.nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ─── DIVIDER ────────────────────────────────────────────────────────────── */
.divider {
  height: 1px;
  background: var(--border);
  margin: 16px 0;
}

/* ─── TOAST ──────────────────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-card-2);
  border: 1px solid var(--border-2);
  border-radius: var(--r-md);
  padding: 10px 18px;
  font-size: 12px;
  color: var(--white-2);
  opacity: 0;
  transition: all 0.3s;
  z-index: 999;
  white-space: nowrap;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: rgba(0,196,140,0.4); color: var(--green); }

/* ─── RESPONSIVE ─────────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  .form-grid { grid-template-columns: 1fr; }
  .form-grid.cols-3 { grid-template-columns: 1fr; }
  .form-grid.cols-4 { grid-template-columns: 1fr 1fr; }
  .span-2, .span-3 { grid-column: span 1; }
  .weather-tiles { grid-template-columns: repeat(2,1fr); }
  .weather-stats { grid-template-columns: repeat(2,1fr); }
  .photo-grid { grid-template-columns: repeat(3,1fr); }
  .review-grid { grid-template-columns: 1fr; }
  .main { padding: 16px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <a href="/projects" style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--white-3);padding:4px 8px;border:0.5px solid var(--border);border-radius:var(--r-sm);margin-right:4px;flex-shrink:0" title="Projects Hub">← Hub</a>
  <a class="logo" href="#">
    <div class="logo-icon">
      <svg viewBox="0 0 30 30" fill="none" width="18" height="18">
        <rect x="2" y="2" width="26" height="26" rx="2.5" stroke="#00D4FF" stroke-width="1.2" transform="rotate(45 15 15)" fill="none"/>
        <path d="M11 8C7 8 4.5 11 4.5 15C4.5 19 7 22 11 22" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
        <line x1="14" y1="8" x2="24" y2="22" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"/>
        <line x1="24" y1="8" x2="14" y2="22" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="logo-name">Controlynx<span>.ai</span></span>
  </a>
  <div class="header-center">
    <div class="header-title">Daily Progress Report</div>
    <div class="header-sub" id="headerSub">New Report</div>
  </div>
  <div class="header-right">
    <div class="save-indicator">
      <div class="save-dot"></div>
      <span>Saved</span>
    </div>
    <div class="role-badge" id="roleBadge">Planner / PCE</div>
    <div class="step-counter"><span id="stepCurrent">1</span> / <span id="stepTotal">11</span></div>
  </div>
</header>

<!-- PROGRESS BAR -->
<div class="progress-bar-track">
  <div class="progress-bar-fill" id="progressFill" style="width:9%"></div>
</div>

<!-- TAB NAV -->
<nav class="tab-nav" id="tabNav">
  <!-- Tabs injected by JS -->
</nav>

<!-- MAIN CONTENT -->
<main class="main" id="mainContent">
  <!-- Panels injected by JS -->
</main>

<!-- NAV ROW -->
<div class="nav-row">
  <button class="nav-btn back" id="btnBack" onclick="navigate(-1)">← Back</button>
  <div id="navCenter" style="font-size:11px;color:var(--white-3)"></div>
  <button class="nav-btn next" id="btnNext" onclick="navigate(1)">Continue →</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── APP STATE ─────────────────────────────────────────────────────────────
const STATE = {
  role: (() => {
    try { return JSON.parse(localStorage.getItem('cx_user')||'{}').role || 'planner'; } catch(e){ return 'planner'; }
  })(),
  user: (() => {
    try { return JSON.parse(localStorage.getItem('cx_user')||'{}'); } catch(e){ return {}; }
  })(),
  currentTab: 0,
  tabStatus: new Array(11).fill('empty'),
  p6Library: [],
  data: {
    identity: {
      projectName:'', client:'', pmc:'', consultant:'', contractor:'',
      startDate:'', plannedFinish:'', contractNo:'', reportPrefix:'DPR',
      siteCoords:'', shift:'day', zone:'', submittedBy:''
    },
    weather: {
      condition:'clear', maxTemp:'', minTemp:'', humidity:'', windSpeed:'', visibility:'',
      workStoppage:'', stoppageDuration:'', affectedWorks:'', ntr:false, fetching:false
    },
    safety: {
      toolboxConducted:'yes', toolboxAttendees:'', toolboxTopic:'',
      manHours:'', walkConducted:'yes', walkInspector:'', walkAreas:'', walkFindings:'',
      sors:[], ncrs:[], incidents:[], ntrSor:false, ntrNcr:false, ntrIncident:false, ntrWalk:false
    },
    labour: {
      mainContractor:{ name:'Main Contractor', trades:[] },
      subcontractors:[]
    },
    staffing: {
      mainContractor:{ name:'Main Contractor', positions:[] },
      subcontractors:[]
    },
    equipment: { items:[], mobilisation:'', demobilisation:'', ntr:false },
    materials: { items:[], ntr:false },
    activities: { items:[], tomorrowPlan:'' },
    allocation: { items:[] },
    issues: { items:[], ntr:false },
    photos: { items:[] }
  }
};

// ─── TAB DEFINITIONS ──────────────────────────────────────────────────────
const TABS = [
  { id:'identity',   label:'Identity',    icon:'🏗', roles:['planner'] },
  { id:'weather',    label:'Weather',     icon:'🌤', roles:['planner'] },
  { id:'safety',     label:'Safety',      icon:'🦺', roles:['safety','planner'] },
  { id:'labour',     label:'Labour',      icon:'👷', roles:['timekeeper','planner'] },
  { id:'staffing',   label:'Staffing',    icon:'👔', roles:['timekeeper','planner'] },
  { id:'equipment',  label:'Equipment',   icon:'🏗', roles:['storekeeper','planner'] },
  { id:'materials',  label:'Materials',   icon:'📦', roles:['qaqc','planner'] },
  { id:'activities', label:'Activities',  icon:'📋', roles:['engineer','planner'] },
  { id:'allocation', label:'Allocation',  icon:'⚙', roles:['engineer','planner'] },
  { id:'issues',     label:'Issues',      icon:'⚠', roles:['engineer','planner'] },
  { id:'photos',     label:'Photos',      icon:'📷', roles:['engineer','safety','planner','admin'] },
  { id:'sign-off',   label:'Sign-off',    icon:'✅', roles:['planner'] }
];

// ─── CALCULATED FIELDS ────────────────────────────────────────────────────
function calcDuration() {
  const s = STATE.data.identity.startDate;
  const f = STATE.data.identity.plannedFinish;
  if (!s || !f) return '—';
  const d = Math.ceil((new Date(f) - new Date(s)) / 86400000);
  return d > 0 ? d + 'd' : '—';
}
function calcElapsed() {
  const s = STATE.data.identity.startDate;
  if (!s) return '—';
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(s);
  const d = Math.ceil((today - start) / 86400000);
  return d >= 0 ? d + 'd' : '—';
}
function calcRemaining() {
  const s = STATE.data.identity.startDate;
  const f = STATE.data.identity.plannedFinish;
  if (!s || !f) return '—';
  const today = new Date(); today.setHours(0,0,0,0);
  const finish = new Date(f);
  const d = Math.ceil((finish - today) / 86400000);
  return d >= 0 ? d + 'd' : '<span style="color:var(--red)">' + Math.abs(d) + 'd overdue</span>';
}
function calcReportNo() {
  const prefix = STATE.data.identity.reportPrefix || 'DPR';
  const today = new Date();
  const s = STATE.data.identity.startDate;
  if (!s) return prefix + '-0001';
  const n = Math.max(1, Math.ceil((today - new Date(s)) / 86400000));
  return prefix + '-' + String(n).padStart(4,'0');
}
function getReportDate() {
  return new Date().toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
}

// ─── WEATHER FETCH ────────────────────────────────────────────────────────
async function fetchWeather() {
  const coords = STATE.data.identity.siteCoords;
  if (!coords || STATE.data.weather.ntr) return;
  const [lat, lng] = coords.split(',').map(s => s.trim());
  if (!lat || !lng) return;
  STATE.data.weather.fetching = true;
  renderWeatherFetching();
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code,visibility&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto`);
    const d = await r.json();
    STATE.data.weather.maxTemp = Math.round(d.daily.temperature_2m_max[0]);
    STATE.data.weather.minTemp = Math.round(d.daily.temperature_2m_min[0]);
    STATE.data.weather.humidity = d.current.relative_humidity_2m;
    STATE.data.weather.windSpeed = Math.round(d.current.wind_speed_10m);
    STATE.data.weather.visibility = d.current.visibility ? Math.round(d.current.visibility/1000) + 'km' : 'Good';
    const wc = d.current.weather_code;
    STATE.data.weather.condition = wc === 0 ? 'clear' : wc < 50 ? 'cloudy' : wc < 70 ? 'rain' : 'sandstorm';
  } catch(e) {
    showToast('Weather fetch failed — please enter manually');
  }
  STATE.data.weather.fetching = false;
  if (STATE.currentTab === 1) renderPanel(1);
}

function renderWeatherFetching() {
  const el = document.getElementById('weatherAutoArea');
  if (el) el.innerHTML = '<div class="weather-loading"><div class="spin"></div>Fetching live weather data…</div>';
}

// ─── INIT ──────────────────────────────────────────────────────────────────
function init() {
  // Set role badge
  const roleLabels = {
    planner:'Planner / PCE', safety:'Safety Manager',
    timekeeper:'Timekeeper', storekeeper:'Storekeeper',
    engineer:'Site Engineer', qaqc:'QA/QC Engineer', admin:'Admin'
  };
  const badge = document.getElementById('roleBadge');
  if (badge) badge.textContent = roleLabels[STATE.role] || STATE.role;

  // Set user name in header
  const sub = document.getElementById('headerSub');
  if (sub && STATE.user.full_name) sub.textContent = STATE.user.full_name;

  // For non-planner roles, jump to their first accessible tab
  if (STATE.role !== 'planner' && STATE.role !== 'admin') {
    const visible = getVisibleTabs();
    if (visible.length > 0) STATE.currentTab = visible[0].originalIndex;
  }

  buildTabNav();
  renderPanel(STATE.currentTab);
  updateHeaderSub();
  updateProgress();
}

function getVisibleTabs() {
  // Returns only tabs this role can access
  return TABS.map((t, i) => ({ ...t, originalIndex: i }))
    .filter(t => t.roles.includes(STATE.role) || STATE.role === 'planner' || STATE.role === 'admin');
}

function buildTabNav() {
  const nav = document.getElementById('tabNav');
  const visible = getVisibleTabs();
  nav.innerHTML = visible.map((t, visIdx) => {
    const i = t.originalIndex;
    const status = getTabStatus(i);
    return `
    <button class="tab-btn${i===STATE.currentTab?' active':''}${status==='complete'?' complete':''}${status==='ntr'?' ntr-confirmed':''}"
      id="tabBtn${i}" onclick="jumpToTab(${i})">
      <span class="tab-num">${String(visIdx+1).padStart(2,'0')}</span>
      <span class="tab-icon">${t.icon}</span>
      ${t.label}
    </button>`;
  }).join('');
}

function jumpToTab(i) {
  STATE.currentTab = i;
  buildTabNav();
  renderPanel(i);
  updateProgress();
  scrollTabIntoView(i);
}

function scrollTabIntoView(i) {
  const btn = document.getElementById('tabBtn'+i);
  if (btn) btn.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
}

function navigate(dir) {
  const visible = getVisibleTabs().map(t => t.originalIndex);
  const currentPos = visible.indexOf(STATE.currentTab);
  const nextPos = currentPos + dir;
  if (nextPos < 0 || nextPos >= visible.length) return;
  const next = visible[nextPos];
  STATE.currentTab = next;
  buildTabNav();
  renderPanel(next);
  updateProgress();
  scrollTabIntoView(next);
  document.getElementById('mainContent').scrollTop = 0;
}

function updateProgress() {
  const visible = getVisibleTabs();
  const currentPos = visible.findIndex(t => t.originalIndex === STATE.currentTab);
  const pos = currentPos >= 0 ? currentPos : 0;
  const pct = ((pos + 1) / visible.length * 100).toFixed(0);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('stepCurrent').textContent = pos + 1;
  document.getElementById('stepTotal').textContent = visible.length;
  document.getElementById('btnBack').disabled = STATE.currentTab === 0;
  document.getElementById('btnNext').textContent = STATE.currentTab === TABS.length - 1 ? 'Submit ✓' : 'Continue →';
  if (STATE.currentTab === TABS.length - 1) {
    document.getElementById('btnNext').classList.add('next');
    document.getElementById('btnNext').onclick = () => submitReport();
  } else {
    document.getElementById('btnNext').onclick = () => navigate(1);
  }
}

function updateHeaderSub() {
  const sub = document.getElementById('headerSub');
  if (STATE.data.identity.projectName) {
    sub.textContent = STATE.data.identity.projectName + ' · ' + getReportDate();
  } else {
    sub.textContent = getReportDate();
  }
}

// ─── PANEL RENDERERS ──────────────────────────────────────────────────────
function renderPanel(i) {
  const mc = document.getElementById('mainContent');
  const renderers = [
    renderIdentity, renderWeather, renderSafety,
    renderLabour, renderStaffing, renderEquipment,
    renderMaterials, renderActivities, renderAllocation,
    renderIssues, renderPhotos, renderSignoff
  ];
  mc.innerHTML = renderers[i]();
  // Bind panel-specific events
  if (i === 0) bindIdentity();
  if (i === 1) bindWeather();
  if (i === 7) {
    const ta = document.getElementById('f_tomorrowPlan');
    if (ta) ta.addEventListener('input', () => { STATE.data.activities.tomorrowPlan = ta.value; autoSave(); });
  }
  if (i === 5) {
    ['mobilisation','demobilisation'].forEach(f => {
      const el = document.getElementById('f_'+f);
      if (el) el.addEventListener('input', () => { STATE.data.equipment[f] = el.value; autoSave(); });
    });
  }
  if (i === 10) {
    const el = document.getElementById('f_finalSubmittedBy');
    if (el) el.addEventListener('input', () => { STATE.data.identity.submittedBy = el.value; autoSave(); });
  }
  updateProgress();
}

// ─── 1. IDENTITY ───────────────────────────────────────────────────────────
function renderIdentity() {
  const d = STATE.data.identity;
  return `
  <div class="section-header">
    <div class="section-title">Project Identity</div>
    <div class="section-desc">Set up your project once. These details auto-populate every report.</div>
  </div>

  <div class="card">
    <div class="card-title">Project information — set once</div>
    <div class="form-grid">
      <div class="field span-2">
        <label>Project Name <span class="req">*</span></label>
        <input type="text" id="f_projectName" value="${d.projectName}" placeholder="e.g. Aldar Manarat Residential Tower — Phase 02">
      </div>
      <div class="field">
        <label>Client / Employer <span class="req">*</span></label>
        <input type="text" id="f_client" value="${d.client}" placeholder="e.g. Aldar Properties">
      </div>
      <div class="field">
        <label>Main Contractor <span class="req">*</span></label>
        <input type="text" id="f_contractor" value="${d.contractor}" placeholder="e.g. Bright Accord General Contracting LLC">
      </div>
      <div class="field">
        <label>PMC</label>
        <input type="text" id="f_pmc" value="${d.pmc}" placeholder="e.g. Hill International">
      </div>
      <div class="field">
        <label>Consultant</label>
        <input type="text" id="f_consultant" value="${d.consultant}" placeholder="e.g. Ultra-Architectural Consultancy">
      </div>
      <div class="field">
        <label>Contract Number</label>
        <input type="text" id="f_contractNo" value="${d.contractNo}" placeholder="e.g. SIMR2-EW-BAG-P2">
      </div>
      <div class="field">
        <label>Report Number Prefix <span class="req">*</span></label>
        <input type="text" id="f_reportPrefix" value="${d.reportPrefix}" placeholder="e.g. DPR or BAGC-DPR">

function bindIdentity() {
  const fields = ['projectName','client','pmc','consultant','contractor','contractNo','reportPrefix','startDate','plannedFinish','shift','zone','submittedBy'];
  fields.forEach(f => {
    const el = document.getElementById('f_'+f);
    if (!el) return;
    el.addEventListener('input', () => {
      STATE.data.identity[f] = el.value;
      document.getElementById('calc_duration').textContent = calcDuration();
      document.getElementById('calc_elapsed').textContent = calcElapsed();
      document.getElementById('calc_remaining').innerHTML = calcRemaining();
      document.getElementById('calc_reportNo').textContent = calcReportNo();
      updateHeaderSub();
      autoSave();
    });
  });
  initSiteMap();
}

let _siteMap = null;
let _siteMarker = null;

function initSiteMap() {
  if (typeof L === 'undefined' || !document.getElementById('siteMap')) return;
  if (_siteMap) { try { _siteMap.remove(); } catch(e){} _siteMap = null; }

  const defaultCoords = [24.4539, 54.3773];
  const savedCoords = STATE.data.identity.siteCoords
    ? STATE.data.identity.siteCoords.split(',').map(s => parseFloat(s.trim()))
    : null;
  const initCoords = savedCoords || defaultCoords;
  const initZoom = savedCoords ? 14 : 5;

  _siteMap = L.map('siteMap', { zoomControl: true }).setView(initCoords, initZoom);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: 'Map data © OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(_siteMap);

  const markerIcon = L.divIcon({
    html: '<div style="width:18px;height:18px;background:#00D4FF;border:3px solid #fff;border-radius:50%;box-shadow:0 0 12px rgba(0,212,255,0.8)"></div>',
    iconSize: [18,18], iconAnchor: [9,9], className: ''
  });

  if (savedCoords) {
    _siteMarker = L.marker(savedCoords, { icon: markerIcon, draggable: true }).addTo(_siteMap);
    _siteMarker.on('dragend', e => setMapCoords(e.target.getLatLng()));
  }

  _siteMap.on('click', e => {
    if (_siteMarker) _siteMap.removeLayer(_siteMarker);
    _siteMarker = L.marker(e.latlng, { icon: markerIcon, draggable: true }).addTo(_siteMap);
    _siteMarker.on('dragend', ev => setMapCoords(ev.target.getLatLng()));
    setMapCoords(e.latlng);
  });
}

function setMapCoords(latlng) {
  const coords = latlng.lat.toFixed(6) + ', ' + latlng.lng.toFixed(6);
  STATE.data.identity.siteCoords = coords;
  const el = document.getElementById('coordDisplay');
  if (el) { el.textContent = coords; el.style.color = 'var(--green)'; }
  autoSave();
}

function getCurrentLocation() {
  if (!navigator.geolocation) { showToast('Geolocation not available'); return; }
  showToast('Getting your location...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
      if (_siteMap) { _siteMap.setView(ll, 15); _siteMap.fire('click', { latlng: ll }); }
      showToast('Location captured', true);
    },
    () => showToast('Could not get location — click the map instead')
  );
}

async function searchMapLocation() {
  const q = document.getElementById('mapSearch')?.value?.trim();
  if (!q) return;
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(q) + '&format=json&limit=1&accept-language=en');
    const data = await r.json();
    if (data.length > 0) {
      const ll = L.latLng(parseFloat(data[0].lat), parseFloat(data[0].lon));
      if (_siteMap) { _siteMap.setView(ll, 14); _siteMap.fire('click', { latlng: ll }); }
      showToast('Location found: ' + data[0].display_name.substring(0, 50), true);
    } else {
      showToast('Location not found — try a different search term');
    }
  } catch(e) { showToast('Search failed — check your connection'); }
}

        <div style="margin-top:8px">
          <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:rgba(139,92,246,0.12);border:0.5px solid rgba(139,92,246,0.3);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;color:rgba(139,92,246,1)">

function getFilteredActivities(floor, discipline, p6Lib) {
  if (!p6Lib || p6Lib.length === 0) return [];
  return p6Lib.filter(a => {
    const floorMatch = !floor || (a.floor && a.floor === floor);
    const discMatch  = !discipline || (a.discipline && a.discipline === discipline);
    return floorMatch && discMatch;
  });
}

        <div class="form-grid cols-3" style="margin-bottom:10px">

            <label>Floor / Level <span class="req">*</span></label>

function toggleActivityExpand(i) {

function selectP6Activity(i, actId) {
  const lib = STATE.data.p6Library || [];
  const found = lib.find(a => a.id === actId);
  if (found) {
    STATE.data.activities.items[i].p6Id = found.activity_id;
    STATE.data.activities.items[i].description = found.activity_name;

  renderPanel(STATE.currentTab);

// ─── 9. ALLOCATION ─────────────────────────────────────────────────────────

function toggleAllocExpand(i) {
  if (!STATE.data.allocation.items[i]) STATE.data.allocation.items[i] = {};

  STATE.data.allocation.items[i].expanded = current === false ? true : false;
  const body = document.getElementById('allocBody_' + i);
  if (body) body.style.display = body.style.display === 'none' ? '' : 'none';
  const chevron = body?.previousElementSibling?.querySelector('span:last-child');
  if (chevron) chevron.style.transform = body.style.display === 'none' ? '' : 'rotate(180deg)';
}

function adjustAllocTradeField(actIdx, ti, field, delta) {
  if (!STATE.data.allocation.items[actIdx]) STATE.data.allocation.items[actIdx] = { trades:[] };
  if (!STATE.data.allocation.items[actIdx].trades[ti]) STATE.data.allocation.items[actIdx].trades[ti] = {};
  STATE.data.allocation.items[actIdx].trades[ti][field] = Math.max(0, (parseInt(STATE.data.allocation.items[actIdx].trades[ti][field])||0) + delta);
  renderPanel(STATE.currentTab);
}

function setAllocTradeField(actIdx, ti, field, val) {
  if (!STATE.data.allocation.items[actIdx]) STATE.data.allocation.items[actIdx] = { trades:[] };
  if (!STATE.data.allocation.items[actIdx].trades[ti]) STATE.data.allocation.items[actIdx].trades[ti] = {};
  STATE.data.allocation.items[actIdx].trades[ti][field] = field === 'supplier' ? val : Math.max(0, parseInt(val)||0);
  autoSave();
}

// ─── 11. SIGN-OFF ──────────────────────────────────────────────────────────
function getTabStatus(i) {
  // If manually marked, use that
  if (STATE.tabStatus[i] === 'ntr') return 'ntr';

  const d = STATE.data;
  switch(i) {
    case 0: // Identity
      return (d.identity.projectName && d.identity.contractor && d.identity.startDate) ? 'complete' : 'empty';
    case 1: // Weather
      if (d.weather.ntr) return 'ntr';
      return d.weather.condition ? 'complete' : 'empty';
    case 2: // Safety
      if (d.safety.ntrSor && d.safety.ntrNcr && d.safety.ntrIncident && d.safety.ntrWalk) return 'ntr';
      return (d.safety.toolboxConducted) ? 'complete' : 'empty';
    case 3: // Labour
      const mainTotal = d.labour.mainContractor.trades.reduce((a,t)=>a+(parseInt(t.count)||0),0);
      const subTotal = d.labour.subcontractors.reduce((a,s)=>a+s.trades.reduce((b,t)=>b+(parseInt(t.count)||0),0),0);
      return (mainTotal + subTotal) > 0 ? 'complete' : 'empty';
    case 4: // Staffing
      const staffMain = d.staffing.mainContractor.positions.reduce((a,p)=>a+(parseInt(p.count)||0),0);
      const staffSub = d.staffing.subcontractors.reduce((a,s)=>a+s.positions.reduce((b,p)=>b+(parseInt(p.count)||0),0),0);
      return (staffMain + staffSub) > 0 ? 'complete' : 'empty';
    case 5: // Equipment
      if (d.equipment.ntr) return 'ntr';
      return d.equipment.items.length > 0 ? 'complete' : 'empty';
    case 6: // Materials
      if (d.materials.ntr) return 'ntr';
      return d.materials.items.length > 0 ? 'complete' : 'empty';
    case 7: // Activities
      return d.activities.items.length > 0 ? 'complete' : 'empty';
    case 8: // Allocation
      return d.allocation.items.some(a => a && a.trades && a.trades.length > 0) ? 'complete' : 'empty';
    case 9: // Issues
      if (d.issues.ntr) return 'ntr';
      return d.issues.items.length > 0 ? 'complete' : 'empty';
    default:
      return STATE.tabStatus[i] || 'empty';
  }
}


// ─── 11. PHOTOS ────────────────────────────────────────────────────────────
function renderPhotos() {
  const d = STATE.data.photos || { items: [] };
  return `
  <div class="section-header">
    <div class="section-title">Progress Photos</div>

    ${(d.items||[]).map((p,i) => `
    <div style="background:var(--bg-card);border:0.5px solid var(--border);border-radius:var(--r-md);overflow:hidden;position:relative">
      ${p.dataUrl ? `<img src="${p.dataUrl}" style="width:100%;height:120px;object-fit:cover;display:block">` : `<div style="width:100%;height:120px;background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-size:28px">📷</div>`}
      <div style="padding:8px">
        <div style="font-size:11px;color:var(--white-2);margin-bottom:4px">${p.caption || 'No caption'}</div>
        <div style="font-size:10px;color:var(--white-4)">${p.location || ''}</div>
      </div>
      <button onclick="removePhoto(${i})" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.6);border:none;color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center">×</button>
    </div>`).join('')}
    <label style="background:var(--bg-card);border:1.5px dashed var(--border2);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;justify-content:center;height:160px;cursor:pointer;gap:6px">
      <span style="font-size:28px">+</span>
      <span style="font-size:12px;color:var(--white-3)">Add photo</span>
      <input type="file" accept="image/*" multiple style="display:none" onchange="addPhotos(this.files)">
    </label>
  </div>
  <div style="margin-top:8px;padding:12px;background:var(--bg-3);border-radius:var(--r-md);font-size:12px;color:var(--white-3)">
    📷 ${(d.items||[]).length} photo${(d.items||[]).length !== 1 ? 's' : ''} attached to this report
  </div>`;
}

function addPhotos(files) {
  if (!files || !files.length) return;
  const items = STATE.data.photos.items || [];
  let loaded = 0;
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      items.push({ dataUrl: e.target.result, caption: file.name.replace(/\.[^.]+$/, ''), location: '', timestamp: new Date().toISOString() });
      STATE.data.photos.items = items;
      loaded++;
      if (loaded === files.length) { autoSave(); renderPanel(STATE.currentTab); }
    };
    reader.readAsDataURL(file);
  });
}

function removePhoto(i) {
  STATE.data.photos.items.splice(i, 1);
  autoSave();
  renderPanel(STATE.currentTab);
}

function renderSignoff() {
  const tabs = TABS.slice(0,10);
  const statuses = tabs.map((t,i) => getTabStatus(i));
  const allReady = statuses.every(s => s === 'complete' || s === 'ntr');
  return `
  <div class="section-header">
    <div class="section-title">Review & Submit</div>
    <div class="section-desc">Planner/PCE reviews all sections before final submission. Click any tab to go back and edit.</div>
  </div>
  <div class="card">
    <div class="card-title">Submission checklist</div>
    <div class="review-grid">
      ${tabs.map((t,i) => {
        const s = statuses[i];
        let icon = '○', cls = 'rs-empty', label = 'Not filled';
        if (s === 'complete') { icon = '✓'; cls = 'rs-complete'; label = 'Complete'; }
        else if (s === 'ntr') { icon = '—'; cls = 'rs-ntr'; label = 'Nothing to report'; }
        return `
        <div class="review-item" onclick="jumpToTab(${i})" style="cursor:pointer">
          <span class="review-icon">${t.icon}</span>
          <span class="review-tab-name">${t.label}</span>
          <span class="review-status ${cls}">${icon} ${label}</span>
        </div>`;
      }).join('')}
    </div>

// Load today's report from server (creates new one if needed)
async function loadTodayReport() {
  const project = (() => { try { return JSON.parse(localStorage.getItem('cx_project')||'{}'); } catch(e){ return {}; } })();
  const token = localStorage.getItem('cx_token');
  if (!project.id) {
    if (token) {
      // Logged in but no project — go to projects hub
      window.location.href = '/projects';
      return;
    }
    // Not logged in — redirect to login
    window.location.href = '/login.html';
    return;
  }
  STATE.projectId = project.id;
  // Load identity from project
  STATE.data.identity.projectName  = project.name || '';
  STATE.data.identity.client       = project.client || '';
  STATE.data.identity.pmc          = project.pmc || '';
  STATE.data.identity.consultant   = project.consultant || '';
  STATE.data.identity.contractor   = project.contractor || '';
  STATE.data.identity.contractNo   = project.contract_number || '';
  STATE.data.identity.startDate    = project.start_date || '';
  STATE.data.identity.plannedFinish= project.planned_finish || '';
  STATE.data.identity.reportPrefix = project.report_prefix || 'DPR';
  STATE.data.identity.siteCoords   = project.site_lat ? project.site_lat + ', ' + project.site_lng : '';

  // Load P6 activity library (parallel with report fetch)
  const [reportResult, p6Result] = await Promise.allSettled([
    apiCall('GET', '/api/projects/' + project.id + '/today'),
    apiCall('GET', '/api/projects/' + project.id + '/p6/activities')
  ]);

  if (p6Result.status === 'fulfilled' && Array.isArray(p6Result.value) && p6Result.value.length > 0) {
    STATE.p6Library = p6Result.value.map(a => ({
      id:          a.activity_id,
      description: a.description,
      wbs:         a.wbs_name,
      floor:       a.floor       || '',
      discipline:  a.discipline  || '',
      plannedStart: a.planned_start  || '',
      plannedFinish: a.planned_finish || '',
      duration:    a.duration    || 0
    }));
  }

  if (reportResult.status === 'fulfilled' && reportResult.value && reportResult.value.id) {
    reportToState(reportResult.value);
    showToast('Report loaded — ' + reportResult.value.report_number, true);
  } else if (reportResult.status === 'rejected') {
    loadDraftLocal();
    init();
    return;
  }
  init();
}

// ── P6 XER Upload from DPR ────────────────────────────────────
async function uploadP6XER(file) {
  if (!file || !STATE.projectId) return;
  if (!file.name.toLowerCase().endsWith('.xer')) {
    showToast('Please upload a .xer file from Primavera P6', false);
    return;
  }
  showToast('Reading XER file…', true);
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const text = e.target.result;
      if (!text.includes('%T') || !text.includes('TASK')) {
        showToast('Invalid XER file format', false); return;
      }
      showToast('Uploading to server…', true);
      const token = localStorage.getItem('cx_token');
      // Encode as base64 to safely transmit XER content through JSON
      const xer_base64 = btoa(unescape(encodeURIComponent(text)));
      const res = await fetch('/api/projects/' + STATE.projectId + '/p6/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ xer_base64 })
      });
      const data = await res.json();
      if (data.success) {
        showToast('✓ ' + data.activities_imported + ' P6 activities imported. Refreshing…', true);
        // Reload p6 library
        const acts = await apiCall('GET', '/api/projects/' + STATE.projectId + '/p6/activities');
        if (Array.isArray(acts)) {
          STATE.p6Library = acts.map(a => ({
            id: a.activity_id, description: a.description,
            wbs: a.wbs_name, floor: a.floor || '', discipline: a.discipline || '',
            plannedStart: a.planned_start || '', plannedFinish: a.planned_finish || '',
            duration: a.duration || 0
          }));
          setTimeout(() => { init(); }, 800);
        }
      } else {
        showToast('P6 upload failed: ' + (data.error || 'Unknown error'), false);
      }
    } catch(err) {
      showToast('Upload error: ' + err.message, false);
    }
  };
  reader.readAsText(file);
}

// ── P6 Weekly Export ──────────────────────────────────────────
async function exportP6Progress() {
  if (!STATE.projectId) return;
  const token = localStorage.getItem('cx_token');
  showToast('Generating P6 export…', true);
  try {
    const res = await fetch('/api/projects/' + STATE.projectId + '/p6/export', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) { showToast('Export failed', false); return; }
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'P6_Progress_Export_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('✓ P6 export downloaded', true);
  } catch(err) {
    showToast('Export error: ' + err.message, false);
  }
}

</script>
